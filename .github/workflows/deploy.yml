name: llm-interactive-course deployment checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      activate:
        description: Activate the tested release on the existing server
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: homepage-deploy
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check deployment scripts
        run: |
          set -euo pipefail
          python3 -m py_compile deploy/source-snapshot.py deploy/release.py deploy/site-package.py deploy/verify-site.py
          bash -n deploy/upload-source.sh deploy/build-on-server.sh deploy/deploy.sh
          python3 -B deploy/test-release.py
          python3 -B deploy/test-site-package.py
          python3 deploy/site-package.py check .
      - name: Create and verify the exact source snapshot
        run: |
          set -euo pipefail
          commit=$(git rev-parse HEAD)
          temporary=$(mktemp -d)
          cleanup() { rm -rf -- "$temporary"; }
          trap cleanup EXIT
          python3 deploy/source-snapshot.py create "$commit" "$temporary/snapshot"
          python3 deploy/source-snapshot.py verify \
            "$commit" "$temporary/snapshot/source" \
            "$temporary/snapshot/source-manifest.json"

  deploy:
    needs: checks
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.HOMEPAGE_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      HOMEPAGE_DEPLOY_HOST: ${{ vars.HOMEPAGE_DEPLOY_HOST }}
      HOMEPAGE_DEPLOY_PORT: ${{ vars.HOMEPAGE_DEPLOY_PORT }}
      HOMEPAGE_DEPLOY_USER: ${{ vars.HOMEPAGE_DEPLOY_USER }}
      HOMEPAGE_SSH_PRIVATE_KEY: ${{ secrets.HOMEPAGE_SSH_PRIVATE_KEY }}
      HOMEPAGE_SSH_KNOWN_HOSTS: ${{ secrets.HOMEPAGE_SSH_KNOWN_HOSTS }}
      HOMEPAGE_ACTIVATE_RELEASE: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.activate == true) }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Transfer, build and optionally activate the tested release
        run: bash deploy/upload-source.sh
